; Tyro HRM — project-specific PHP-FPM overrides (php:8.4-fpm-alpine)
; Mounted over the image defaults at /usr/local/etc/php/conf.d/zz-app.ini

date.timezone = UTC

; Media uploads (avatars, documents) and Inertia/Wayfinder payloads
upload_max_filesize = 50M
post_max_size = 50M
max_file_uploads = 20

memory_limit = 256M
max_execution_time = 120
max_input_time = 120

; Large HRM forms (dynamic field sets, bulk selects) exceed the 1000 default
max_input_vars = 5000

; Runtime hardening — don't leak errors to responses, keep them in logs
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

expose_php = Off

; Sessions are handled by Laravel's database driver, not PHP's native handler
session.save_handler = files
session.gc_probability = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
