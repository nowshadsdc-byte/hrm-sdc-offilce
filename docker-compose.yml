x-php-dev: &php-dev
  build:
    context: .
    dockerfile: Dockerfile
    target: dev
    args:
      WWWUSER: ${WWWUSER:-1000}
      WWWGROUP: ${WWWGROUP:-1000}
  image: hrm-php-dev:latest
  restart: unless-stopped
  working_dir: /var/www/html
  env_file: [.env]
  volumes:
    - .:/var/www/html
  networks: [hrm_net]

services:
  php:
    <<: *php-dev
    container_name: hrm_php
    depends_on:
      mysql:
        condition: service_healthy

  queue:
    <<: *php-dev
    container_name: hrm_queue
    user: "www-data:www-data"
    command: php artisan queue:work --tries=3 --sleep=3 --max-time=3600
    depends_on: [php]

  scheduler:
    <<: *php-dev
    container_name: hrm_scheduler
    user: "www-data:www-data"
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    depends_on: [php]

  nginx:
    image: nginx:stable-alpine
    container_name: hrm_nginx
    restart: unless-stopped
    ports:
      - "1998:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html:ro
    depends_on: [php]
    networks: [hrm_net]

  mysql:
    image: mysql:8.4
    container_name: hrm_mysql
    restart: unless-stopped
    ports:
      - "1999:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [hrm_net]

  node:
    build:
      context: .
      dockerfile: Dockerfile
      target: node-dev
    image: hrm-node-dev:latest
    container_name: hrm_node
    working_dir: /var/www/html
    ports:
      - "1990:1990"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks: [hrm_net]

volumes:
  node_modules:

networks:
  hrm_net:
    driver: bridge
